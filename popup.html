<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 230px;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 12px;
      margin: 0;
      color: #37352f;
    }
    h3 {
      font-size: 14px;
      margin: 0 0 6px 0;
    }
    p {
      font-size: 11px;
      color: #6b6b6b;
      margin: 0 0 10px 0;
      line-height: 1.3;
    }
    .status {
      padding: 6px;
      background: #e1f5fe;
      color: #0288d1;
      border-radius: 4px;
      font-size: 11px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .pro-box {
      border-top: 1px solid #e9e9e7;
      padding-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    input {
      width: 100%;
      padding: 6px;
      font-size: 11px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 6px;
      background: #2eaadc;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #0288d1;
    }
    .buy-link {
      display: block;
      text-align: center;
      font-size: 10px;
      color: #0288d1;
      text-decoration: none;
      margin-top: 4px;
    }
    .buy-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h3>Notion CSV Exporter</h3>
  <p>Open any Notion page with tables and click the export button on top of the table.</p>
  
  <div id="statusBadge" class="status">FREE PLAN (10 rows limit)</div>

  <div class="pro-box">
    <input type="text" id="licenseKey" placeholder="Enter License Key">
    <button id="activateBtn">Activate PRO</button>
    <a href="https://payhip.com/b/bBqtO" target="_blank" class="buy-link">Get a PRO Key on Payhip</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
